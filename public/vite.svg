<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Fondo -->
  <rect width="100" height="100" rx="15" fill="url(#grad1)"/>
  
  <!-- Cubo 3D simplificado -->
  <g transform="translate(50, 50)">
    <!-- Cara frontal -->
    <polygon points="0,-20 15,-10 15,10 0,20 -15,10 -15,-10" fill="#ffffff" opacity="0.9"/>
    <!-- Cara superior -->
    <polygon points="0,-20 15,-10 0,0 -15,-10" fill="#ffffff" opacity="0.7"/>
    <!-- Cara lateral -->
    <polygon points="15,-10 15,10 0,20 0,0" fill="#ffffff" opacity="0.5"/>
  </g>
  
  <!-- Texto 3D -->
  <text x="50" y="85" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">
    3D
  </text>
</svg>
